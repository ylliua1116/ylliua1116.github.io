<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Animated research concept diagram">
<!-- yuli-premium-manuscript-motion-2026: M2-Hierarchical-Federated-Fusion, zero visible text -->
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcfaff"/><stop offset=".53" stop-color="#f5f2ff"/><stop offset="1" stop-color="#e9f5fb"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#c8b6ff" stop-opacity=".41"/><stop offset="1" stop-color="#c8b6ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="seaHalo"><stop stop-color="#9be0e6" stop-opacity=".34"/><stop offset="1" stop-color="#9be0e6" stop-opacity="0"/></radialGradient>
 <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ae96f0"/><stop offset="1" stop-color="#7052c9"/></linearGradient>
 <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#8de6d5"/><stop offset="1" stop-color="#3caeb9"/></linearGradient>
 <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c3edf8"/><stop offset="1" stop-color="#83c4dc"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#faf9ff" stop-opacity=".7"/></linearGradient>
 <linearGradient id="signal" x1="0" y1="0" x2="1"><stop stop-color="#8865d2" stop-opacity="0"/><stop offset=".5" stop-color="#8e63e7"/><stop offset="1" stop-color="#47babc" stop-opacity="0"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.35" fill="#aa98d7" opacity=".22"/></pattern>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#6b4aa2" flood-opacity=".17"/></filter>
 <filter id="glow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="tinyglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
 <marker id="arrowPurple" markerWidth="7" markerHeight="7" refX="5.2" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#896ad4"/></marker>
 <marker id="arrowTeal" markerWidth="7" markerHeight="7" refX="5.2" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#44b6ae"/></marker>
 <clipPath id="viewport"><rect width="720" height="480" rx="29"/></clipPath>
 <style>
 @keyframes breathe{0%,100%{opacity:.42;transform:scale(.94)}50%{opacity:1;transform:scale(1.065)}}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes spinback{to{transform:rotate(-360deg)}}
 @keyframes sway{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}
 @keyframes wave{0%,100%{transform:translateX(0px)}50%{transform:translateX(-13px)}}
 @keyframes slide{0%{opacity:.1;transform:translateX(-16px)}30%,75%{opacity:1}100%{opacity:.15;transform:translateX(16px)}}
 @keyframes shimmer{0%,100%{opacity:.28}48%{opacity:.9}}
 .breath{animation:breathe 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .sway{animation:sway 4.7s ease-in-out infinite}
 .spin{animation:spin 3.1s linear infinite;transform-box:fill-box;transform-origin:center}
 .spinback{animation:spinback 4s linear infinite;transform-box:fill-box;transform-origin:center}
 .wave{animation:wave 7s ease-in-out infinite}
 .glimmer{animation:shimmer 3.3s ease-in-out infinite}
 .slide{animation:slide 3.9s ease-in-out infinite}
 .travelers{opacity:.9}
 @media (prefers-reduced-motion:reduce){.breath,.sway,.spin,.spinback,.wave,.glimmer,.slide{animation:none!important}.travelers{display:none}}
 </style>
</defs>
