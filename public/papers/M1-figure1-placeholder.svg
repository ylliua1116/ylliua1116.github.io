<circle cx="329" cy="224" r="79" fill="none" stroke="#c0b0ee" stroke-width="7" opacity=".44"/>
<circle cx="329" cy="224" r="63" fill="url(#glass)" stroke="#8e72da" stroke-width="3.5" filter="url(#shadow)"/>
<g class="spin" fill="none" stroke="#886bce" stroke-width="4.5" stroke-linecap="round"><path d="M329 170 A54 54 0 0 1 382 222"/><path d="M329 278 A54 54 0 0 1 275 226"/></g>
