<rect x="462" y="154" width="116" height="107" rx="27" fill="url(#glass)" stroke="#967fe0" stroke-width="2.6"/>
<rect x="479" y="171" width="82" height="72" rx="19" fill="#eee9ff" stroke="#d0c4f9" stroke-width="1.5"/>
<path d="M500 209 L521 190 L543 209 L521 229 Z" fill="#9b83e3" opacity=".7"/>
<circle class="breath" cx="522" cy="209" r="10" fill="#62c9c2"/>
</g>
<g filter="url(#shadow)">
<rect x="580" y="117" width="61" height="54" rx="17" fill="#e9f4fa" stroke="#84c7d3" stroke-width="2.5"/>
<circle cx="611" cy="141" r="13" fill="#59bcb8" opacity=".65"/><circle cx="611" cy="141" r="5" fill="#fff"/>
<rect x="595" y="226" width="68" height="57" rx="17" fill="#eee7ff" stroke="#9785db" stroke-width="2.5"/>
