<g opacity=".58" fill="none" stroke="#a8d9e8" stroke-width="1.5"><path d="M-30 370 Q150 323 350 371 T740 365"/><path d="M-30 395 Q155 351 350 394 T750 384"/><path d="M-20 426 Q145 383 350 428 T750 420"/></g>
