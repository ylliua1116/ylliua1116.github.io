<path d="M613 171 Q664 196 648 223" fill="none" stroke="#65bbba" stroke-width="2" stroke-dasharray="6 8"/>
<path d="M628 282 Q613 306 592 316" fill="none" stroke="#8c76d8" stroke-width="2" stroke-dasharray="6 8"/>
<g class="travelers"><circle r="5" fill="#8b65e5" opacity=".48" filter="url(#tinyglow)"/><circle r="2.5" fill="#8b65e5" opacity=".96"/><animateMotion path="M147 147 C213 137 224 182 278 206" dur="3.1s" begin="0s" repeatCount="indefinite"/></g><g class="travelers"><circle r="5" fill="#34b5b8" opacity=".48" filter="url(#tinyglow)"/><circle r="2.5" fill="#34b5b8" opacity=".96"/><animateMotion path="M151 325 Q230 316 280 246" dur="3.8s" begin="-.7s" repeatCount="indefinite"/></g><g class="travelers"><circle r="5" fill="#977ae1" opacity=".48" filter="url(#tinyglow)"/><circle r="2.5" fill="#977ae1" opacity=".96"/><animateMotion path="M359 202 C407 138 464 138 516 179" dur="4.0s" begin="-1s" repeatCount="indefinite"/></g><g class="travelers"><circle r="5" fill="#50b7b7" opacity=".48" filter="url(#tinyglow)"/><circle r="2.5" fill="#50b7b7" opacity=".96"/><animateMotion path="M516 244 C433 342 249 365 165 324" dur="5.4s" begin="-2s" repeatCount="indefinite"/></g><g class="travelers"><circle r="5" fill="#6bbfc1" opacity=".48" filter="url(#tinyglow)"/><circle r="2.5" fill="#6bbfc1" opacity=".96"/><animateMotion path="M522 205 L585 146" dur="2.8s" begin="-.4s" repeatCount="indefinite"/></g><g class="travelers"><circle r="5" fill="#9b7cde" opacity=".48" filter="url(#tinyglow)"/><circle r="2.5" fill="#9b7cde" opacity=".96"/><animateMotion path="M522 205 L614 242" dur="3.3s" begin="-1s" repeatCount="indefinite"/></g>
